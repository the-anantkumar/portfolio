name: Portfolio CI and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Check for new GitHub contributions before deployment
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  SITE_URL: https://the-anantkumar.github.io
  SITE_BASE: /portfolio

jobs:
  refresh:
    name: Refresh calendar
    if: github.repository == 'the-anantkumar/portfolio' && github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.calendar.outputs.changed }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test refresh and fetch public calendar
        run: npm run test:github && npm run refresh:github
      - name: Detect changes
        id: calendar
        run: |
          if git diff --quiet -- src/data/github.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate changed calendar in the site
        if: steps.calendar.outputs.changed == 'true'
        run: npm ci && npm run check && npm run build
      - name: Commit validated data and record revision
        id: commit
        env:
          CHANGED: ${{ steps.calendar.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/data/github.json
            git commit -m "chore: refresh GitHub contribution calendar"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Calendar changed: $CHANGED. Changed snapshots deploy in this workflow." >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate site
    needs: refresh
    permissions:
      contents: read
      pages: read
    if: >-
      always() && !cancelled() &&
      github.repository == 'the-anantkumar/portfolio' && github.event.repository.private == false &&
      (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') &&
      (github.event_name != 'schedule' || needs.refresh.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.refresh.outputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies and Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Check types, build, and test
        run: npm run check && npm run build && npm test && npm run test:browser
      - name: Record verified revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Deploy and verify Pages
    needs: validate
    if: always() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Recreate expected static assets
        run: npm ci && npm run build
      - name: Verify the public release
        env:
          TEST_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: npm run test:hosted
